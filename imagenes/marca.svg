<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Hameem Afnan">
  <title>Hameem Afnan</title>

  <!-- Fondo de tinta: define la marca lo mismo sobre pestaña clara que oscura -->
  <rect width="64" height="64" fill="#14120f"/>

  <!-- Losa de papel, sesgada como el resto de la interfaz -->
  <polygon points="15.74,5 59.74,5 48.26,59 4.26,59" fill="#f4f1e8"/>

  <!-- H didone (astas gruesas, remates y travesaño finos), dibujada a mano y
       con el mismo sesgo que la losa: matrix = skewX(-12deg) sobre y=32 -->
  <g transform="matrix(1 0 -0.2126 1 6.803 0)" fill="#14120f">
    <rect x="20.5" y="15"   width="7"    height="34"/>
    <rect x="36.5" y="15"   width="7"    height="34"/>
    <rect x="27.5" y="30.4" width="9"    height="3.2"/>
    <rect x="17.2" y="15"   width="13.6" height="2.4"/>
    <rect x="17.2" y="46.6" width="13.6" height="2.4"/>
    <rect x="33.2" y="15"   width="13.6" height="2.4"/>
    <rect x="33.2" y="46.6" width="13.6" height="2.4"/>
  </g>

  <!-- Estrella de cuatro puntas: el acento magenta que recorre toda la página -->
  <path d="M53 3 L55.2 10.3 L62 12.5 L55.2 14.7 L53 22 L50.8 14.7 L44 12.5 L50.8 10.3 Z"
        fill="#e0234f"/>
</svg>
